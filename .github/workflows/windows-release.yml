name: Native Windows release acceptance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Run the full release matrix or the Go backend tests alone
        type: choice
        options: [all, go-source]
        default: all
      release_tag:
        description: Candidate release tag in this repository
        required: true
        type: string
      release_id:
        description: Numeric release ID for a draft (published tags can omit it)
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch:
    # GitHub requires push-level permission to read draft releases. This job only fetches
    # release metadata/assets and hashes bytes. It never checks out or runs project code.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Download and verify the release executable
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          if ($env:RELEASE_ID) {
            if ($env:RELEASE_ID -notmatch '^[0-9]+$') { throw 'Invalid numeric release ID' }
            $release = Invoke-RestMethod "$base/$env:RELEASE_ID" -Headers $headers
          } else {
            $release = Invoke-RestMethod "$base/tags/$([Uri]::EscapeDataString($env:RELEASE_TAG))" -Headers $headers
          }
          if ($release.tag_name -cne $env:RELEASE_TAG) { throw 'Release ID does not match the requested tag' }
          $target = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'verified release')
          $app = 'Tingsu-Windows-x86_64.exe'
          foreach ($name in @('SHA256SUMS', $app)) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $name -and $_.state -eq 'uploaded' })
            if ($asset.Count -ne 1) { throw "Missing or ambiguous release asset: $name" }
            curl.exe --fail --silent --show-error --location --retry 3 --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/octet-stream' --output (Join-Path $target $name) "$base/assets/$($asset[0].id)"
            if ($LASTEXITCODE -ne 0) { throw "Asset download failed: $name" }
          }
          $checksum = @(Select-String -Path (Join-Path $target 'SHA256SUMS') -Pattern '^([a-fA-F0-9]{64})\s+\*?Tingsu-Windows-x86_64\.exe$')
          if ($checksum.Count -ne 1) { throw 'Expected exactly one Windows executable in SHA256SUMS' }
          $exe = Join-Path $target $app
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($actual -ne $checksum[0].Matches[0].Groups[1].Value) { throw 'Release executable checksum mismatch' }
          "sha256=$actual" >> $env:GITHUB_OUTPUT
          Write-Host "Verified $app for $($release.tag_name): $actual"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-windows-executable
          path: ${{ runner.temp }}/verified release/Tingsu-Windows-x86_64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows:
    needs: fetch
    name: Windows / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'go-source' && '["go-source"]' || '["workspace","board","codex","go-source","accessibility","transcription"]') }}
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-windows-executable
          path: ${{ runner.temp }}/verified release
      - name: Check the transferred executable
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.fetch.outputs.sha256 }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe'
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'Transferred executable checksum mismatch' }

      - name: Check the system WebView2 runtime and install it when missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-WebViewVersion {
            $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKCU:\Software\$client")) {
              $pv = Get-ItemPropertyValue -LiteralPath $key -Name pv -ErrorAction SilentlyContinue
              if ($pv -and [version]$pv -gt [version]'0.0.0.0') { return $pv }
            }
          }
          $version = Get-WebViewVersion
          if (-not $version) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            curl.exe --fail --silent --show-error --location --retry 3 --output $installer 'https://go.microsoft.com/fwlink/p/?LinkId=2124703'
            if ($LASTEXITCODE -ne 0) { throw 'WebView2 download failed' }
            $signature = Get-AuthenticodeSignature -FilePath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation,') { throw 'Unexpected WebView2 installer signature' }
            $setup = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            $version = Get-WebViewVersion
            if (-not $version) { throw "WebView2 is missing after setup (exit $($setup.ExitCode))" }
          }
          Write-Host "System WebView2 version $version"

      - name: Install the official external Codex CLI for this test
        if: matrix.suite == 'codex'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'codex.zip'
          curl.exe --fail --silent --show-error --location --retry 3 --output $zip https://github.com/openai/codex/releases/download/rust-v0.171.0/codex-x86_64-pc-windows-msvc.exe.zip
          if ($LASTEXITCODE -ne 0) { throw 'Codex download failed' }
          if ((Get-FileHash $zip).Hash -ne '3db356dcd1efdd946741fa7c543d772522777332a996322d325918d04ca01820') { throw 'Codex archive checksum mismatch' }
          $agent = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'System agents')
          Expand-Archive $zip -DestinationPath $agent
          $binary = @(Get-ChildItem $agent -Recurse -File -Include codex.exe,codex-x86_64-pc-windows-msvc.exe)
          if ($binary.Count -ne 1 -or (Get-FileHash $binary[0].FullName).Hash -ne 'cefea4ffee1fff04983a99c0dda99944d8b380e891e740a28b32f4b815a6e0b7') { throw 'Codex executable checksum mismatch' }
          $path = Join-Path $agent 'codex.exe'
          if ($binary[0].FullName -ne $path) { Move-Item -LiteralPath $binary[0].FullName -Destination $path }
          & $path --version
          if ($LASTEXITCODE -ne 0) { throw 'Codex failed to start on Windows' }

      - name: Install test clients
        id: test_clients
        if: contains(fromJSON('["workspace","board","codex","transcription"]'), matrix.suite)
        run: python -m pip install websocket-client==1.8.0 pillow==11.3.0

      - name: Extract and verify the candidate's media helpers
        if: matrix.suite == 'go-source'
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe'
          $media = Join-Path $env:RUNNER_TEMP 'verified components'
          python -m zipfile -e $app $media
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = Join-Path $media bin
          & (Join-Path $bin ffmpeg.exe) -hide_banner -version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & (Join-Path $bin ffprobe.exe) -hide_banner -version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin >> $env:GITHUB_PATH

      - name: Capture a real Windows test window and check process audio when an endpoint is available
        if: matrix.suite == 'go-source'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cl /nologo /std:c++17 /EHsc /O2 /MT tests/windows/acceptance.cpp /Fe:window-test.exe /link winmm.lib user32.lib gdi32.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $helper = (Get-Command tingsu-capture.exe).Source
          ./window-test.exe $helper --window-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          $sources = & $helper audio-sources
          if ($sources -match 'win-monitor') {
            ./window-test.exe $helper --audio-only
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } else { Write-Host 'Runner has no playback endpoint for the WASAPI hardware test.' }

      - uses: actions/setup-go@v5
        if: matrix.suite == 'go-source'
        with:
          go-version-file: go.mod
      - name: Run the Go backend tests on Windows
        if: matrix.suite == 'go-source'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          go test ./...

      - name: Check native startup diagnostics with a missing or changed component
        if: matrix.suite == 'accessibility'
        shell: pwsh
        run: python -u tests/e2e/windows_startup_error.py --app (Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe')

      - name: Create and reopen a meeting with Windows UI Automation
        if: matrix.suite == 'accessibility'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python -u tests/e2e/native_windows_uia.py --app (Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe')

      - name: Exercise the release with the system WebView2 runtime
        if: steps.test_clients.outcome == 'success'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          TINGSU_TEST_DEFAULT_WINDOWS_PROFILE: ${{ matrix.suite == 'codex' && '1' || '0' }}
        run: |
          python -u tests/e2e/native_windows_codex.py --suite ${{ matrix.suite }} --app (Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe') --codex (Join-Path $env:RUNNER_TEMP 'System agents/codex.exe')
