name: Native Windows release acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate release tag in this repository
        required: true
        type: string
      release_id:
        description: Numeric release ID for a draft (published tags can omit it)
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch:
    # GitHub requires push-level permission to read draft releases. This job only fetches
    # release metadata/assets and hashes bytes. It never checks out or runs project code.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Download and verify the release executable
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          if ($env:RELEASE_ID) {
            if ($env:RELEASE_ID -notmatch '^[0-9]+$') { throw 'Invalid numeric release ID' }
            $release = Invoke-RestMethod "$base/$env:RELEASE_ID" -Headers $headers
          } else {
            $release = Invoke-RestMethod "$base/tags/$([Uri]::EscapeDataString($env:RELEASE_TAG))" -Headers $headers
          }
          if ($release.tag_name -cne $env:RELEASE_TAG) { throw 'Release ID does not match the requested tag' }
          $target = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'verified release')
          $app = 'Tingsu-Windows-x86_64.exe'
          foreach ($name in @('SHA256SUMS', $app)) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $name -and $_.state -eq 'uploaded' })
            if ($asset.Count -ne 1) { throw "Missing or ambiguous release asset: $name" }
            curl.exe --fail --silent --show-error --location --retry 3 --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/octet-stream' --output (Join-Path $target $name) "$base/assets/$($asset[0].id)"
            if ($LASTEXITCODE -ne 0) { throw "Asset download failed: $name" }
          }
          $checksum = @(Select-String -Path (Join-Path $target 'SHA256SUMS') -Pattern '^([a-fA-F0-9]{64})\s+\*?Tingsu-Windows-x86_64\.exe$')
          if ($checksum.Count -ne 1) { throw 'Expected exactly one Windows executable in SHA256SUMS' }
          $exe = Join-Path $target $app
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($actual -ne $checksum[0].Matches[0].Groups[1].Value) { throw 'Release executable checksum mismatch' }
          "sha256=$actual" >> $env:GITHUB_OUTPUT
          Write-Host "Verified $app for $($release.tag_name): $actual"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-windows-executable
          path: ${{ runner.temp }}/verified release/Tingsu-Windows-x86_64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows:
    needs: fetch
    name: Windows / native Go desktop
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-windows-executable
          path: ${{ runner.temp }}/verified release
      - name: Check the transferred executable
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.fetch.outputs.sha256 }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe'
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'Transferred executable checksum mismatch' }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Extract release media helpers and run Go suites
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe'
          $media = Join-Path $env:RUNNER_TEMP 'verified components'
          python -m zipfile -e $app $media
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = Join-Path $media bin
          $env:PATH = "$bin;$env:PATH"
          go test ./...
      - name: Capture a real Windows test window and check process audio when an endpoint is available
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cl /nologo /std:c++17 /EHsc /O2 /MT tests/windows/acceptance.cpp /Fe:window-test.exe /link winmm.lib user32.lib gdi32.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $helper = Join-Path $env:RUNNER_TEMP 'verified components/bin/tingsu-capture.exe'
          ./window-test.exe $helper --window-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          $sources = & $helper audio-sources
          if ($sources -match 'win-monitor') {
            ./window-test.exe $helper --audio-only
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } else { Write-Host 'Runner has no playback endpoint for the WASAPI hardware test.' }

      - name: Test missing and altered capture components
        shell: pwsh
        run: python -u tests/e2e/windows_startup_error.py --app (Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe')
      - name: Create a meeting, edit notes, import a transcript and reopen the release
        shell: pwsh
        run: |
          go build -o nativeui.exe ./tests/windows/nativeui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./nativeui.exe -app (Join-Path $env:RUNNER_TEMP 'verified release/Tingsu-Windows-x86_64.exe') -out (Join-Path $env:RUNNER_TEMP 'Native UI tests')
